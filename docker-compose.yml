services:
  db:
    image: postgres:16
    container_name: sistriage-db
    environment:
      POSTGRES_DB: sistriage_db
      POSTGRES_USER: sistriage
      POSTGRES_PASSWORD: sistriage
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      # A API só sobe depois que o banco realmente aceitar conexões,
      # senão a migration falha na primeira execução.
      test: ["CMD-SHELL", "pg_isready -U sistriage -d sistriage_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistriage-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=sistriage_db;Username=sistriage;Password=sistriage"
      Jwt__Key: "chave-de-desenvolvimento-do-sistriage-com-mais-de-32-caracteres"
      Jwt__Issuer: SisTriage
      Jwt__Audience: SisTriageUsers
      Jwt__ExpiracaoMinutos: 60
    ports:
      - "5285:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: sistriage-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Dentro da rede do Docker a API atende pelo nome do serviço.
      VITE_API_TARGET: http://api:8080
    volumes:
      - ./frontend:/app
      # Volume anônimo: mantém o node_modules do container separado do
      # da máquina, evitando conflito de binários entre sistemas diferentes.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  dados-postgres:
